version: "3.9"

services:
  db:
    image: postgres:16
    container_name: delivery_db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: delivery_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: delivery_web
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://appuser:apppassword@db:5432/delivery_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: